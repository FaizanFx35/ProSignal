<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Reset Password — ProSignals</title>
<meta name="theme-color" content="#0a0d13">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-logo"><img src="icon-192.png" alt="ProSignals logo"></div>
  <h1 class="auth-title" style="font-size:2rem;">RESET PASSWORD</h1>
  <p class="auth-subtitle">Choose a new password for your account</p>

  <div class="auth-card">
    <div class="field-group" style="text-align:left;">
      <label>New Password</label>
      <input type="password" id="newPassword" placeholder="At least 6 characters" autocomplete="new-password">
    </div>
    <div class="field-group" style="text-align:left;">
      <label>Confirm New Password</label>
      <input type="password" id="confirmPassword" placeholder="Re-enter password" autocomplete="new-password">
    </div>
    <p class="auth-error" id="resetError"></p>
    <button class="btn-primary" id="resetSubmitBtn">Update Password</button>
    <p class="auth-switch" id="backToLoginRow" style="display:none;">
      <a href="index.html">Back to Login</a>
    </p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script>
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove("show"), 3200);
}

document.getElementById("resetSubmitBtn").addEventListener("click", async () => {
  const pass = document.getElementById("newPassword").value;
  const confirm = document.getElementById("confirmPassword").value;
  const errEl = document.getElementById("resetError");
  const btn = document.getElementById("resetSubmitBtn");
  errEl.textContent = "";

  if (!pass || pass.length < 6){
    errEl.textContent = "Password must be at least 6 characters.";
    return;
  }
  if (pass !== confirm){
    errEl.textContent = "Passwords do not match.";
    return;
  }

  btn.disabled = true;
  const originalText = btn.textContent;
  btn.textContent = "Updating…";

  try {
    // Supabase automatically creates a recovery session when the user
    // lands here from the reset-password email link.
    const { error } = await supabase.auth.updateUser({ password: pass });
    if (error){
      errEl.textContent = error.message;
    } else {
      toast("Password updated! You can log in now.");
      document.querySelector(".auth-card").innerHTML =
        '<p style="color:var(--text); text-align:center; padding:10px 0;">✅ Your password has been updated.</p>';
      document.getElementById("backToLoginRow").style.display = "block";
      document.querySelector(".auth-card").appendChild(document.getElementById("backToLoginRow"));
    }
  } catch (err){
    console.error(err);
    errEl.textContent = "Could not reach the server. Please try again.";
  } finally {
    btn.disabled = false;
    btn.textContent = originalText;
  }
});
</script>
</body>
</html>
