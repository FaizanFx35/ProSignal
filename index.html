<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ProSignals — Welcome</title>
<meta name="theme-color" content="#0a0d13">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="auth-wrap">

  <div class="auth-logo">
    <img src="icon-192.png" alt="ProSignals logo">
  </div>

  <h1 class="auth-title">WELCOME</h1>
  <p class="auth-subtitle">Trade with confidence</p>

  <div class="auth-card">
    <a href="terms.html" class="auth-link">Disclaimer, Policy, Terms &amp; Conditions</a>
    <p class="auth-agree">By logging in to the app, you agree to our Terms &amp; Conditions, Policy, and Disclaimer.</p>

    <hr class="auth-divider">

    <button class="auth-btn" id="googleLoginBtn">
      <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.5 29.5 3.5 24 3.5 12.7 3.5 3.5 12.7 3.5 24S12.7 44.5 24 44.5 44.5 35.3 44.5 24c0-1.2-.1-2.4-.3-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.7 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.5 5.5 29.5 3.5 24 3.5c-7.6 0-14.1 4.3-17.7 10.6z"/><path fill="#4CAF50" d="M24 44.5c5.4 0 10.3-1.8 14.1-5l-6.5-5.5c-2.1 1.5-4.8 2.4-7.6 2.4-5.3 0-9.7-3.1-11.3-7.6l-6.6 5.1C9.7 40.2 16.3 44.5 24 44.5z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.8l6.5 5.5C39.8 37.5 44.5 31.6 44.5 24c0-1.2-.1-2.4-.3-3.5z"/></svg>
      <span>Login with Google</span>
    </button>

    <div class="auth-or"><span>OR</span></div>

    <button class="auth-btn" id="emailLoginBtn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 6l10 7 10-7"/></svg>
      <span>Login with Email</span>
    </button>
  </div>

  <div class="help-card">
    <h3>Need Help?</h3>
    <p>Contact customer support</p>
    <div class="help-icons">
      <a href="mailto:support@prosignals.app" class="help-circle blue" aria-label="Email support">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 6l10 7 10-7"/></svg>
      </a>
      <a href="https://wa.me/10000000000" target="_blank" rel="noopener" class="help-circle green" aria-label="WhatsApp support">
        <svg width="20" height="20" viewBox="0 0 32 32" fill="currentColor"><path d="M16.001 3C9.373 3 4 8.373 4 15c0 2.386.7 4.61 1.91 6.48L4 29l7.71-1.87A11.93 11.93 0 0 0 16 27c6.627 0 12-5.373 12-12S22.628 3 16.001 3zm0 21.6c-1.87 0-3.62-.5-5.13-1.37l-.37-.21-4.57 1.11 1.13-4.46-.24-.38A9.55 9.55 0 0 1 5.4 15c0-5.85 4.75-10.6 10.6-10.6S26.6 9.15 26.6 15 21.85 24.6 16 24.6zm5.4-7.63c-.29-.15-1.74-.86-2.01-.96-.27-.1-.47-.15-.66.15-.2.29-.76.96-.93 1.16-.17.2-.34.22-.63.07-.29-.15-1.24-.46-2.36-1.46-.87-.78-1.46-1.74-1.63-2.03-.17-.29-.02-.45.13-.6.13-.13.29-.34.44-.51.15-.17.2-.29.29-.49.1-.2.05-.37-.02-.51-.07-.15-.66-1.6-.91-2.19-.24-.58-.48-.5-.66-.5-.17-.01-.37-.01-.56-.01-.2 0-.51.07-.78.37-.27.29-1.02 1-1.02 2.44s1.05 2.83 1.19 3.02c.15.2 2.06 3.14 4.99 4.4.7.3 1.24.48 1.67.61.7.22 1.34.19 1.84.12.56-.08 1.74-.71 1.98-1.4.24-.68.24-1.27.17-1.4-.07-.12-.27-.2-.56-.34z"/></svg>
      </a>
    </div>
  </div>

</div>

<!-- ===== EMAIL LOGIN / REGISTER MODAL ===== -->
<div class="modal-overlay" id="emailModal">
  <div class="modal auth-modal">
    <h3 id="emailModalTitle">Login with Email</h3>
    <hr>
    <div class="field-group">
      <label>Email</label>
      <input type="email" id="authEmail" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="field-group" id="passwordField">
      <label>Password</label>
      <input type="password" id="authPassword" placeholder="••••••••" autocomplete="current-password">
      <a href="#" id="forgotPasswordLink" class="forgot-link">Forgot password?</a>
    </div>
    <p class="auth-error" id="authError"></p>
    <button class="btn-primary" id="authSubmitBtn">Login</button>
    <p class="auth-switch">
      <span id="authSwitchText">Don't have an account?</span>
      <a href="#" id="authSwitchLink">Create one</a>
    </p>
    <button class="btn-ghost" id="emailModalClose">Cancel</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
</body>
</html>
